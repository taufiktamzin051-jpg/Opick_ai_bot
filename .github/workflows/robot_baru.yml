name: jalankan bot

on:
  workflow_dispatch: # Tombol jalankan manual di tab Actions
  schedule:
    - cron: '0 */2 * * *' # Otomatis jalan setiap 2 jam sekali (bisa diatur)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v3

    - name: Siapkan Sistem Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Paksa Instal Bahan Pendukung (Anti-Gagal)
      run: |
        python -m pip install --upgrade pip
        pip install telethon requests tweepy gspread google-auth beautifulsoup4

    - name: Nyalakan Robot Afiliasi
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        INVOLVE_ASIA_API_KEY: ${{ secrets.INVOLVE_ASIA_API_KEY }}
        INVOLVE_ASIA_SECRET_KEY: ${{ secrets.INVOLVE_ASIA_SECRET_KEY }}
      run: |
        python main_bot.py
        
