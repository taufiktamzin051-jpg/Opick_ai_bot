name: DEDIK AI Autopilot 24 Jam

on:
  # 1. Memicu robot agar berjalan otomatis setiap 1 jam sekali (24 jam nonstop)
  schedule:
    - cron: '0 * * * *'
  
  # 2. Tombol manual tetap ada sebagai cadangan jika ingin tes kapan saja
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Menghubungkan Kode Source
        uses: actions/checkout@v3

      - name: Menyiapkan Python Server
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Menginstal Pipa Penghubung (Library)
        run: |
          pip install requests gspread oauth2client

      - name: Eksekusi Robot Dedik AI
        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main_bot.py
