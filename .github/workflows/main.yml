name: Dedik AI Auto Run

on:
  workflow_dispatch:

jobs:
  kirim_pesan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Library
        run: pip install requests gspread oauth2client

      - name: Eksekusi Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KREDENSIAL_GCP: ${{ secrets.GCP_CREDENTIALS }}
          ID_LEMBAR_KELIPATAN: ${{ secrets.SPREADSHEET_ID }}
        run: python main_bot.py
