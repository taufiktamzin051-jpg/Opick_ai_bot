name: Dedik AI Autopilot Engine

on:
  # Jalur 1: Robot bisa dinyalakan manual lewat HP kapan saja
  workflow_dispatch:

  # Jalur 2: Robot JALAN OTOMATIS setiap jam 8 pagi WIB (01:00 UTC)
  schedule:
    - cron: '0 1 * * *'

jobs:
  proses_dropship:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Script Kode Terbaru
      uses: actions/checkout@v3

    - name: Siapkan Mesin Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Bahan Bakar Robot (Library)
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Bangunkan Dedik AI
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main_bot.py
