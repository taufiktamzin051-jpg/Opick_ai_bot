name: jalankan bot

on:
  workflow_dispatch: # Tombol manual
  schedule:
    - cron: '*/30 * * * *' # Otomatis jalan ngecek setiap 30 menit sekali

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v3

    - name: Siapkan Sistem Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instal Bahan Ringan
      run: |
        pip install requests tweepy

    - name: Nyalakan Robot Afiliasi v3
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        INVOLVE_ASIA_API_KEY: ${{ secrets.INVOLVE_ASIA_API_KEY }}
        INVOLVE_ASIA_SECRET_KEY: ${{ secrets.INVOLVE_ASIA_SECRET_KEY }}
      run: |
        python main_bot.py
        
